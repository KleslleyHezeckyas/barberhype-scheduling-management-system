<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHype - Premium Style</title>
    <style>
        :root {
            --primary: #8a2be2;
            --primary-hover: #9d4edd;
            --bg: #0a0a0a;
            --card-bg: #111111;
            --text: #ffffff;
            --text-dim: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .appointment-list {
            width: 100%;
            max-width: 450px;
        }

        .appointment-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .revenue-badge {
            display: none;
            background: var(--primary);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="checkAdmin()">BARBERHYPE</h1>

    <div id="revenue" class="revenue-badge">TOTAL: R$ 0.00</div>

    <h2>Book Appointment</h2>
    <div class="form-group">
        <input type="text" id="clientName" placeholder="Client Name">
    </div>
    <div class="form-group">
        <select id="serviceSelect">
            <option value="">Select Service...</option>
        </select>
    </div>
    <div class="form-group">
        <input type="datetime-local" id="appointmentDate">
    </div>
    <button onclick="saveAppointment()">Confirm Appointment</button>
</div>

<div class="appointment-list">
    <h2>Next Clients</h2>
    <div class="form-group">
        <input type="text" id="searchClient" placeholder="Search client..." onkeyup="filterClients()">
    </div>
    <div id="listContainer"></div>
</div>

<script>
    const API_URL = "http://localhost:8081";
    let isAdmin = false;

    async function loadServices() {
        try {
            const response = await fetch(`${API_URL}/services`);
            const services = await response.json();
            const select = document.getElementById('serviceSelect');

            services.forEach(service => {
                const option = document.createElement('option');
                option.value = service.id;
                option.text = `${service.name} - R$ ${service.price.toFixed(2)}`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Error loading services:", error);
        }
    }

    async function loadAppointments() {
        try {
            const response = await fetch(`${API_URL}/appointments`);
            const appointments = await response.json();
            renderAppointments(appointments);
            if (isAdmin) calculateRevenue(appointments);
        } catch (error) {
            console.error("Error loading appointments:", error);
        }
    }

    function renderAppointments(data) {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';

        data.forEach(app => {
            const card = document.createElement('div');
            card.className = 'appointment-card';
            card.innerHTML = `
                <div>
                    <strong>${app.clientName}</strong><br>
                    <small>${app.service ? app.service.name : 'N/A'} - ${new Date(app.dateTime).toLocaleString()}</small>
                </div>
                <div style="display: ${isAdmin ? 'block' : 'none'}">
                    <button class="delete-btn" onclick="deleteAppointment(${app.id})">Cancel</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function saveAppointment() {
        const name = document.getElementById('clientName').value;
        const serviceId = document.getElementById('serviceSelect').value;
        const date = document.getElementById('appointmentDate').value;

        if (!name || !serviceId || !date) return alert("Fill all fields");

        const payload = {
            clientName: name,
            service: { id: parseInt(serviceId) },
            dateTime: date
        };

        try {
            const res = await fetch(`${API_URL}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                location.reload();
            } else {
                alert("Error saving appointment. Check Java console.");
            }
        } catch (error) {
            alert("Connection failed");
        }
    }

    async function deleteAppointment(id) {
        if (confirm("Delete this appointment?")) {
            await fetch(`${API_URL}/appointments/${id}`, { method: 'DELETE' });
            location.reload();
        }
    }

    function checkAdmin() {
        const pass = prompt("Admin Password:");
        if (pass === "1234") {
            isAdmin = true;
            document.getElementById('revenue').style.display = 'block';
            loadAppointments();
            alert("Admin Access Granted");
        } else {
            alert("Wrong password");
        }
    }

    function calculateRevenue(data) {
        const total = data.reduce((acc, curr) => acc + (curr.service ? curr.service.price : 0), 0);
        document.getElementById('revenue').innerText = `TOTAL: R$ ${total.toFixed(2)}`;
    }

    function filterClients() {
        const term = document.getElementById('searchClient').value.toLowerCase();
        const cards = document.querySelectorAll('.appointment-card');
        cards.forEach(card => {
            const name = card.querySelector('strong').innerText.toLowerCase();
            card.style.display = name.includes(term) ? 'flex' : 'none';
        });
    }

    window.onload = () => {
        loadServices();
        loadAppointments();
    };
</script>
</body>
</html>
